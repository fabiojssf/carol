services:
  db:
    image: postgres:16-alpine
    container_name: carol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carol_db
      POSTGRES_USER: carol_user
      POSTGRES_PASSWORD: carol_secret_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carol_user -d carol_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  carol:
    build: .
    container_name: carol-monitor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - DATABASE_URL=postgresql://carol_user:carol_secret_123@db:5432/carol_db
      - CAROL_CERTIDOES_DIR=/app/certidoes
    volumes:
      - ./certidoes:/app/certidoes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
